<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeLuther - مشغل الفيديو</title>
    <link rel="shortcut icon" href="img/TITLEBAR.PNG" type="image/x-icon"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            text-align: right;
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #poster {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #0c0c14 center/cover no-repeat;
            opacity: 1;
            transition: opacity 0.6s ease;
        }
        #poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.5));
        }
        #poster.hide { opacity: 0; pointer-events: none; }

        video, #hls-video {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #big-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(229, 30, 58, 0.92);
            border: 3px solid rgba(255,255,255,0.85);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(0,0,0,0.55);
            transition: transform 0.18s ease, background 0.18s ease, opacity 0.25s ease;
        }
        #big-play:hover { transform: translate(-50%, -50%) scale(1.07); background: #e51e3a; }
        #big-play svg { width: 36px; height: 36px; margin-right: 4px; }
        #big-play.hide { opacity: 0; pointer-events: none; }

        #controls-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 18px;
            background: linear-gradient(rgba(0,0,0,0.55), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #controls-top.active { opacity: 1; }
        #episode-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }
        #loading-overlay.show { display: flex; }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #e51e3a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { color: #ccc; font-size: 14px; letter-spacing: 0.3px; }

        #error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            padding: 24px;
        }
        #error-overlay.show { display: flex; }
        #error-icon { font-size: 46px; opacity: 0.6; }
        #error-text { color: #ddd; font-size: 16px; max-width: 420px; line-height: 1.5; }

        #skip-controls {
            position: absolute;
            left: 18px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            z-index: 5;
            pointer-events: none;
        }
        .skip-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: rgba(20, 22, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transform: translateX(-12px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .skip-btn.show { opacity: 1; transform: translateX(0); }
        .skip-btn:hover { background: rgba(229,30,58,0.9); border-color: #e51e3a; }

        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 18px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7) 72%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #controls.active { opacity: 1; }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #seek-bar {
            position: relative;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.22);
            cursor: pointer;
            margin-bottom: 12px;
            overflow: visible;
        }
        .seek-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            border-radius: 3px;
            pointer-events: none;
        }
        .seek-fill.buffer { background: rgba(255,255,255,0.35); }
        .seek-fill.progress { background: #e51e3a; }
        .seek-thumb {
            position: absolute;
            top: 50%;
            right: 0;
            width: 13px;
            height: 13px;
            transform: translate(50%, -50%);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        #seek-bar:hover .seek-thumb,
        #seek-bar.dragging .seek-thumb { opacity: 1; }

        #time-display {
            font-size: 13px;
            color: #e8e8e8;
            min-width: 108px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .ctrl-btn svg { width: 20px; height: 20px; }
        #prev-ep-btn, #next-ep-btn { color: #b5a8ff; }
        #prev-ep-btn:hover, #next-ep-btn:hover { background: rgba(181,168,255,0.2); color: #cfc9ff; }
        #prev-ep-btn.hide, #next-ep-btn.hide { display: none; }

        #volume-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #volume-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 3px;
            background: rgba(255,255,255,0.3);
            outline: none;
            cursor: pointer;
        }
        #volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        #settings-btn { font-size: 18px; }
        #settings-menu {
            position: absolute;
            left: 12px;
            bottom: 74px;
            z-index: 12;
            width: 240px;
            background: rgba(14, 14, 20, 0.92);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            padding: 8px;
            display: none;
            backdrop-filter: blur(14px);
        }
        #settings-menu.open { display: block; }
        .menu-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 6px;
        }
        .menu-back {
            background: none;
            border: none;
            color: #bbb;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            visibility: hidden;
        }
        .menu-back.visible { visibility: visible; }
        .menu-title { font-size: 13px; font-weight: 600; color: #e8e8e8; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background: none;
            border: none;
            border-radius: 8px;
            color: #d5d8e6;
            font-size: 13.5px;
            cursor: pointer;
            text-align: right;
        }
        .menu-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .menu-item.active { color: #b5a8ff; font-weight: 700; }
        .menu-value { color: #8b93b5; font-size: 12.5px; }
        .menu-item.hide { display: none; }
        #cc-btn.on { color: #b5a8ff; }

        .seek-indicator {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.55);
            border-radius: 50%;
            width: 76px;
            height: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 6;
        }
        .seek-indicator.show { opacity: 1; }
        .seek-indicator .seek-time { font-size: 11px; color: #fff; }
        #center-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
        }
        #center-flash.show { animation: flashPop 0.5s ease; }
        @keyframes flashPop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="poster"></div>
        <div id="controls-top">
            <span id="episode-title">جاري التشغيل</span>
        </div>
        <div id="loading-overlay" class="show">
            <div class="spinner"></div>
            <div id="loading-text">جاري تحميل الفيديو...</div>
        </div>
        <div id="error-overlay">
            <div id="error-icon">⚠️</div>
            <div id="error-text">فشل تحميل الفيديو.</div>
        </div>
        <div id="skip-controls">
            <button id="skip-intro-btn" class="skip-btn">تخطي المقدمة</button>
            <button id="skip-outro-btn" class="skip-btn">تخطي النهاية</button>
        </div>
        <button id="big-play" title="تشغيل">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <video id="hls-video" playsinline controlslist="nodownload" preload="metadata"></video>
        <div id="center-flash"></div>
        <div id="seek-indicator" class="seek-indicator"></div>
        <div id="settings-menu">
            <div class="menu-header">
                <button id="menu-back" class="menu-back">←</button>
                <span id="menu-title" class="menu-title">الإعدادات</span>
            </div>
            <div id="menu-items" class="menu-items"></div>
        </div>
        <div id="controls">
            <div id="seek-bar">
                <div id="seek-buffer" class="seek-fill buffer"></div>
                <div id="seek-progress" class="seek-fill progress"></div>
                <div id="seek-thumb" class="seek-thumb"></div>
            </div>
            <div class="controls-row">
                <button id="prev-ep-btn" class="ctrl-btn" title="الحلقة السابقة"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
                <button id="play-btn" class="ctrl-btn" title="تشغيل/إيقاف"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg></button>
                <button id="rewind-btn" class="ctrl-btn" title="ترجيع 10 ثواني"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
                <button id="forward-btn" class="ctrl-btn" title="تقديم 10 ثواني"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
                <button id="next-ep-btn" class="ctrl-btn" title="الحلقة التالية"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h2v12H4zm3.5 6 8.5-6v12z"/></svg></button>
                <div id="volume-container">
                    <button id="mute-btn" class="ctrl-btn" title="كتم الصوت"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/></svg></button>
                    <input type="range" id="volume-bar" value="100" min="0" max="100">
                </div>
                <span id="time-display">0:00 / 0:00</span>
                <div style="flex:1"></div>
                <button id="cc-btn" class="ctrl-btn" title="الترجمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="6" width="20" height="12" rx="3"/></svg></button>
                <button id="pip-btn" class="ctrl-btn" title="نافذة عائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg></button>
                <button id="settings-btn" class="ctrl-btn" title="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></button>
                <button id="fullscreen-btn" class="ctrl-btn" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        function getQueryParam(name) { return new URLSearchParams(window.location.search).get(name) || ''; }
        let videoUrl = '';
        try { videoUrl = decodeURIComponent(getQueryParam('url') || getQueryParam('v')); } catch (e) { videoUrl = getQueryParam('url'); }
        document.getElementById('episode-title').textContent = decodeURIComponent(getQueryParam('title')) || 'AnimeLuther';

        const posterUrl = decodeURIComponent(getQueryParam('poster')) || '';
        if (posterUrl) document.getElementById('poster').style.backgroundImage = `url("${posterUrl}")`;

        const subsMeta = (() => { try { return JSON.parse(getQueryParam('subs') || '[]'); } catch (e) { return []; } })();
        let subtitleIndex = -1;

        const video = document.getElementById('hls-video');
        const playerContainer = document.getElementById('player-container');
        const playBtn = document.getElementById('play-btn');
        const bigPlay = document.getElementById('big-play');
        const seekBar = document.getElementById('seek-bar');
        const seekProgress = document.getElementById('seek-progress');
        const seekBuffer = document.getElementById('seek-buffer');
        const seekThumb = document.getElementById('seek-thumb');
        const timeDisplay = document.getElementById('time-display');
        const volumeBar = document.getElementById('volume-bar');
        const muteBtn = document.getElementById('mute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const errorOverlay = document.getElementById('error-overlay');
        const errorText = document.getElementById('error-text');
        const settingsBtn = document.getElementById('settings-btn');
        const ccBtn = document.getElementById('cc-btn');
        const settingsMenu = document.getElementById('settings-menu');
        const menuBack = document.getElementById('menu-back');
        const menuTitle = document.getElementById('menu-title');
        const menuItems = document.getElementById('menu-items');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const prevEpBtn = document.getElementById('prev-ep-btn');
        const nextEpBtn = document.getElementById('next-ep-btn');
        const controls = document.getElementById('controls');
        const controlsTop = document.getElementById('controls-top');
        let controlsTimeout = null;
        let settingsOpen = false;

        function formatTime(s) {
            if (!isFinite(s) || s < 0) s = 0;
            s = Math.floor(s);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
        }

        function showControls(keep) {
            controls.classList.add('active');
            controlsTop.classList.add('active');
            clearTimeout(controlsTimeout);
            if (!keep) controlsTimeout = setTimeout(() => { if (!settingsOpen) hideControls(); }, 2500);
        }
        function hideControls() {
            controls.classList.remove('active');
            controlsTop.classList.remove('active');
        }

        function renderSeek() {
            const d = video.duration || 0;
            const t = video.currentTime || 0;
            const pct = d ? (t / d) * 100 : 0;
            seekProgress.style.width = pct + '%';
            seekThumb.style.right = pct + '%';
            timeDisplay.textContent = `${formatTime(t)} / ${formatTime(d)}`;
            try {
                const b = video.buffered;
                let maxEnd = 0;
                for (let i = 0; i < b.length; i++) if (b.end(i) > maxEnd) maxEnd = b.end(i);
                seekBuffer.style.width = (d ? (maxEnd / d) * 100 : 0) + '%';
            } catch (e) {}
        }

        let seekDrag = false;
        function seekToClientX(clientX) {
            const rect = seekBar.getBoundingClientRect();
            const ratio = Math.min(Math.max((rect.right - clientX) / rect.width, 0), 1);
            video.currentTime = ratio * (video.duration || 0);
            renderSeek();
        }
        seekBar.addEventListener('pointerdown', (e) => { seekDrag = true; seekToClientX(e.clientX); });
        window.addEventListener('pointermove', (e) => { if (seekDrag) seekToClientX(e.clientX); });
        window.addEventListener('pointerup', () => { seekDrag = false; });

        bigPlay.addEventListener('click', () => video.play().catch(() => {}));
        playBtn.addEventListener('click', () => video.paused ? video.play() : video.pause());

        video.addEventListener('play', () => { bigPlay.classList.add('hide'); });
        video.addEventListener('pause', () => { bigPlay.classList.remove('hide'); });
        video.addEventListener('timeupdate', renderSeek);

        rewindBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
        forwardBtn.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

        const hasPrev = getQueryParam('hasPrev') === '1';
        const hasNext = getQueryParam('hasNext') === '1';
        if (!hasPrev) prevEpBtn.classList.add('hide');
        if (!hasNext) nextEpBtn.classList.add('hide');
        prevEpBtn.addEventListener('click', () => window.parent.postMessage({ type: 'player-nav', dir: -1 }, '*'));
        nextEpBtn.addEventListener('click', () => window.parent.postMessage({ type: 'player-nav', dir: 1 }, '*'));

        volumeBar.addEventListener('input', () => { video.volume = volumeBar.value / 100; });
        muteBtn.addEventListener('click', () => { video.muted = !video.muted; });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) playerContainer.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        });

        function loadVideo(url) {
            if (!url) { loadingOverlay.classList.remove('show'); errorOverlay.classList.add('show'); return; }
            if (url.includes('.m3u8')) {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                script.onload = () => {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => { loadingOverlay.classList.remove('show'); video.play().catch(()=>{}); });
                    }
                };
                document.head.appendChild(script);
            } else {
                video.src = url;
                video.addEventListener('loadedmetadata', () => { loadingOverlay.classList.remove('show'); video.play().catch(()=>{}); });
            }
        }

        function initSubtitles() {
            if (!subsMeta.length) { ccBtn.style.display = 'none'; return; }
            subsMeta.forEach((t) => {
                const tr = document.createElement('track');
                tr.kind = 'subtitles';
                tr.label = t.label || t.lang || 'ترجمة';
                tr.srclang = t.lang || 'ar';
                tr.src = t.file;
                video.appendChild(tr);
            });
            ccBtn.addEventListener('click', () => {
                const tracks = video.textTracks;
                if (tracks.length > 0) {
                    tracks[0].mode = tracks[0].mode === 'showing' ? 'hidden' : 'showing';
                    ccBtn.classList.toggle('on', tracks[0].mode === 'showing');
                }
            });
        }

        initSubtitles();
        loadVideo(videoUrl);
    </script>
</body>
</html>
